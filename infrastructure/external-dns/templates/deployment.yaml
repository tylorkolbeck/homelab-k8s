apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: external-dns
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          args:
            {{- range .Values.sources }}
            - --source={{ . }}
            {{- end }}
            - --provider={{ .Values.provider }}
            - --domain-filter={{ .Values.global.domain }}
            - --registry={{ .Values.global.externalDns.registry }}
            - --txt-owner-id={{ .Values.global.externalDns.txtOwnerId }}
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.cloudflare.apiTokenSecret }}
                  key: {{ .Values.global.cloudflare.apiTokenKey | default "token" }}
