# Global fallbacks (overridden by values/global.yaml in ArgoCD)
global:
  domain: ghport.com
  cloudflare:
    apiTokenSecret: cloudflare-api-token
    apiTokenKey: token
  externalDns:
    registry: txt
    txtOwnerId: k3s-gitops

namespace: kube-system
replicaCount: 1
serviceAccountName: external-dns

image:
  repository: registry.k8s.io/external-dns/external-dns
  tag: v0.15.0
  pullPolicy: IfNotPresent

provider: cloudflare
sources:
  - service
