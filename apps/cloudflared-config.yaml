apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: argocd
data:
  config.yaml: |
    metrics: 0.0.0.0:20000
    ingress:
      - hostname: argocd.ghport.com
        originRequest:
          noTLSVerify: true
        service: https://argocd-server.argocd.svc.cluster.local:443
      - hostname: hello.ghport.com
        service: http://hello-svc.default.svc.cluster.local:80
      - service: http_status:404