apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: argocd
data:
  config.yaml: |
    tunnel: 0a34eb9a-78c0-4ab8-934c-efc911515c34
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:20000
    ingress:
      - hostname: argocd.ghport.com
        service: http://argocd-server.argocd.svc.cluster.local:80
      - hostname: hello.ghport.com
        service: http://hello-svc.apps.svc.cluster.local:80
      - hostname: hello2.ghport.com
        service: http://hello2-svc.apps.svc.cluster.local:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: argocd
  annotations:
    configmap.reloader.stakater.com/reload: "cloudflared-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: cloudflared-config
      - name: creds
        secret:
          secretName: tunnel-credentials
