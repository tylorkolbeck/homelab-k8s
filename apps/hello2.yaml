apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello2-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello2-app
  template:
    metadata:
      labels:
        app: hello2-app
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello2-svc
  namespace: apps
  annotations:
    external-dns.alpha.kubernetes.io/hostname: hello2.ghport.com
    external-dns.alpha.kubernetes.io/target: 0a34eb9a-78c0-4ab8-934c-efc911515c34.cfargotunnel.com
spec:
  type: ClusterIP
  selector:
    app: hello2-app
  ports:
  - port: 80
    targetPort: 80
