apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello2-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello2-app
  template:
    metadata:
      labels:
        app: hello2-app
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello2-svc
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: hello2-app
  ports:
  - port: 80
    targetPort: 80
