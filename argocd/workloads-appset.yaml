apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: 'https://github.com/tylorkolbeck/homelab-k8s.git'
        revision: HEAD
        directories:
          - path: 'apps/*'
  template:
    metadata:
      name: '{{.path.basename}}'
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: workloads
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: 'https://github.com/tylorkolbeck/homelab-k8s.git'
          targetRevision: HEAD
          ref: values
        - repoURL: 'https://github.com/tylorkolbeck/homelab-k8s.git'
          targetRevision: HEAD
          path: charts/app-template
          helm:
            releaseName: '{{.path.basename}}'
            valueFiles:
              - $values/values/global.yaml
              - $values/{{.path.path}}/values.yaml
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: apps
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
